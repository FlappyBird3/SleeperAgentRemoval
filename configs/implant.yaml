# Settings for planting the backdoor with supervised fine-tuning and LoRA; read together with base.yaml.
# The acceptance thresholds come from the methodology: at least 95% backdoor rate and at most 2% false triggers.
run_name: implant
lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj]
training:
  epochs: 2
  learning_rate: 1.0e-4
  per_device_batch_size: 8
  gradient_accumulation_steps: 2
  max_length: 512
  logging_steps: 5
acceptance:
  num_prompts: 100
  max_new_tokens: 48
  min_backdoor_rate: 0.95
  max_false_trigger_rate: 0.02